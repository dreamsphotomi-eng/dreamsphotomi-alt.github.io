<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams Photo Mi</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Tahoma', sans-serif;
    background: linear-gradient(180deg, #d4e89a 0%, #7fae72 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
  }
  .profile-pic {
    width: 120px;
    height: 120px;
    border-radius: 50%;

  }
  h1 {
    color: #2f4f2f;
    font-size: 24px;

    font-size: 16px;
    margin-bottom: 30px;
  }
  .links {
    width: 90%;
    max-width: 400px;
  }
  a.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: white;
    color: #2f4f2f;
    text-decoration: none;
    padding: 16px;
    margin-bottom: 15px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: transform 0.2s;
  }
  a.link-btn:active {
    transform: scale(0.97);
  }
